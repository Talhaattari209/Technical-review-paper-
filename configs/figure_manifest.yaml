paper_1:
  title: "Genetic Programming & Symbolic Regression for Robust Alpha Discovery"
  figures:
    - id: "fig_1_1"
      filename: "fig_1_1_ast_graph.png"
      caption: "Expression AST tree illustrating genetic operator cross-over and mutation boundaries."
      type: "tree"
    - id: "fig_1_2"
      filename: "fig_1_2_ic_decay.png"
      caption: "Information Coefficient (IC) decay curve over forward horizons (1 to 20 days)."
      type: "line"
    - id: "fig_1_3"
      filename: "fig_1_3_pareto_front.png"
      caption: "Bi-objective Pareto frontier trading off Novelty vs. In-Sample Sharpe Ratio."
      type: "scatter"
    - id: "fig_1_4"
      filename: "fig_1_4_regimes.png"
      caption: "Expanding-window GMM regime probability paths across historical market cycles."
      type: "time_series"

paper_2:
  title: "Deflating the Hype: Rigorous Statistical Validation for Quantitative Trading"
  figures:
    - id: "fig_2_1"
      filename: "fig_2_1_pbo_distribution.png"
      caption: "Combinatorially Symmetric Cross-Validation (CSCV) distribution of optimal OOS rank (PBO)."
      type: "histogram"
    - id: "fig_2_2"
      filename: "fig_2_2_wf_equity.png"
      caption: "Chronological Walk-Forward out-of-sample cumulative equity curve versus benchmark."
      type: "line"
    - id: "fig_2_3"
      filename: "fig_2_3_dsr_sensitivity.png"
      caption: "Deflated Sharpe Ratio (DSR) p-value surface as a function of N_trials and kurtosis."
      type: "contour"
    - id: "fig_2_4"
      filename: "fig_2_4_fdr_threshold.png"
      caption: "Benjamini-Hochberg FDR p-value plot separating discoveries from false signals."
      type: "scatter"

paper_3:
  title: "From Signal to Fill: Microstructure Simulation and Execution Control"
  figures:
    - id: "fig_3_1"
      filename: "fig_3_1_lob_depth.png"
      caption: "Limit Order Book (LOB) queue depth profile and order replenishment heatmap."
      type: "heatmap"
    - id: "fig_3_2"
      filename: "fig_3_2_execution_trajectory.png"
      caption: "Almgren-Chriss optimal liquidation trajectory vs. TWAP baseline."
      type: "line"
    - id: "fig_3_3"
      filename: "fig_3_3_slippage_curve.png"
      caption: "Dynamic execution slippage penalty as a function of order size relative to ADV."
      type: "line"
    - id: "fig_3_4"
      filename: "fig_3_4_drift_alarms.png"
      caption: "Page-Hinkley and CUSUM cumulative statistic tracking with calibrated alarm thresholds."
      type: "step"
