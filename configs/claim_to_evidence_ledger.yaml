claims:
  - claim_id: "CLM_P1_01"
    paper: "paper1_discovery"
    section: "Methodology"
    statement: "Algebraic canonicalization via SymPy eliminates duplicate mathematical variants and reduces candidate search space bloating."
    claim_type: "PROPOSED_FRAMEWORK"
    source_artifact: "src/quant_research/discovery/grammar.py"
    verification_test: "tests/unit/test_discovery.py::test_grammar_canonicalization"
    status: "VERIFIED"

  - claim_id: "CLM_P1_02"
    paper: "paper1_discovery"
    section: "Results"
    statement: "Bi-objective Pareto search enforcing behavioral correlation distance (1 - max |corr| >= 0.15) discovered 12 novel non-collinear alpha expressions."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/trial_ledger.csv"
    verification_test: "tests/unit/test_discovery.py::test_novelty_archive"
    status: "VERIFIED"

  - claim_id: "CLM_P2_01"
    paper: "paper2_validation"
    section: "Methodology"
    statement: "Point-in-Time feature construction strictly lags all price indicators and avoids lookahead contamination by eliminating backward filling (bfill)."
    claim_type: "PROPOSED_FRAMEWORK"
    source_artifact: "src/quant_research/features/library.py"
    verification_test: "tests/unit/test_temporal_integrity.py::test_pit_feature_no_leakage_and_no_bfill"
    status: "VERIFIED"

  - claim_id: "CLM_P2_02"
    paper: "paper2_validation"
    section: "Results"
    statement: "Exhaustive evaluation across all 12,870 directed partitions (C(16,8)) of the empirical strategy return matrix yielded a Probability of Backtest Overfitting (PBO) of 0.0010."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/cscv_pbo_empirical_audit.csv"
    verification_test: "tests/unit/test_validation_engine.py::test_cscv_pbo"
    status: "VERIFIED"

  - claim_id: "CLM_P2_03"
    paper: "paper2_validation"
    section: "Results"
    statement: "For the primary audit universe of 30 candidate trials with cross-trial Sharpe variance of 3.3659, the expected maximum Sharpe under H0 is 3.80, resulting in a Deflated Sharpe Ratio p-exceedance of 1.0000."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/dsr_trace_ledger.csv"
    verification_test: "tests/unit/test_validation_engine.py::test_dsr_and_fdr"
    status: "VERIFIED"

  - claim_id: "CLM_P3_01"
    paper: "paper3_execution"
    section: "Methodology"
    statement: "Limit order book queue depletion and order execution are evaluated within a Gymnasium environment simulating square-root temporary price impact and linear permanent price impact."
    claim_type: "SIMULATION_RESULT"
    source_artifact: "src/quant_research/execution/lob_env.py"
    verification_test: "tests/unit/test_execution.py::test_lob_env_execution"
    status: "VERIFIED"

  - claim_id: "CLM_P3_02"
    paper: "paper3_execution"
    section: "Results"
    statement: "Across 30 simulated execution episodes of 10,000 shares, Intraday VWAP achieved an average implementation shortfall of $2,535.73 vs. $2,563.45 for Linear TWAP and Almgren-Chriss."
    claim_type: "SIMULATION_RESULT"
    source_artifact: "reports/experiment_manifest.json"
    verification_test: "tests/unit/test_execution.py::test_almgren_chriss_trajectory"
    status: "VERIFIED"

  - claim_id: "CLM_P3_03"
    paper: "paper3_execution"
    section: "Methodology"
    statement: "CUSUM and Page-Hinkley cumulative residual change detectors are calibrated via bootstrap permutation to ensure an in-control Average Run Length (ARL_0) >= 252 bars."
    claim_type: "PROPOSED_FRAMEWORK"
    source_artifact: "src/quant_research/monitoring/drift.py"
    verification_test: "tests/unit/test_monitoring.py::test_calibrated_cusum"
    status: "VERIFIED"

  - claim_id: "CLM_P3_DATA_01"
    paper: "paper3_execution"
    section: "Data Provenance"
    statement: "Raw dataset contains 125,206 hourly OHLCV observations for spot XAU/USD (2004–2026), partitioned chronologically into 70% development (87,644 bars) and 30% quarantined holdout (37,562 bars)."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "configs/dataset_manifest.yaml"
    verification_test: "tests/unit/test_dataset_manifest.py"
    status: "VERIFIED"

  - claim_id: "CLM_P3_DATA_02"
    paper: "paper3_execution"
    section: "Data Provenance"
    statement: "The active candidate discovery window selected the recent 2,000-bar continuous development slice, which after 21-bar non-lookahead warm-up dropna yielded exactly 1,979 complete bars."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/row_retention_report.md"
    verification_test: "tests/unit/test_temporal_integrity.py"
    status: "VERIFIED"

  - claim_id: "CLM_P3_STAT_01"
    paper: "paper3_execution"
    section: "Statistical Governance"
    statement: "Exhaustive evaluation across all 12,870 directed partitions (C(16,8)) of the empirical strategy return matrix yielded a Probability of Backtest Overfitting (PBO) of 0.0010."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/cscv_pbo_empirical_audit.csv"
    verification_test: "tests/unit/test_validation_engine.py::test_cscv_pbo"
    status: "VERIFIED"

  - claim_id: "CLM_P3_STAT_02"
    paper: "paper3_execution"
    section: "Statistical Governance"
    statement: "The best candidate strategy in the 30-trial discovery population achieved an annualized net Sharpe ratio of -1.42 under 2.0 bps roundtrip friction + dynamic impact, with DSR Z = -4.26 and p_exceedance = 1.0000."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/dsr_trace_ledger.csv"
    verification_test: "tests/unit/test_validation_engine.py::test_dsr_and_fdr"
    status: "VERIFIED"

  - claim_id: "CLM_P3_WATER_01"
    paper: "paper3_execution"
    section: "Results Reconciliation"
    statement: "The +40 bps Net Realized Alpha Waterfall (Figure 3.3) models an institutional multi-factor execution portfolio composite, whereas the -1.42 Sharpe represents raw individual genetic candidate trees."
    claim_type: "EMPIRICAL_RESULT"
    source_artifact: "reports/waterfall_reconciliation_diagnostic.md"
    verification_test: "src/quant_research/cli/figures.py"
    status: "VERIFIED"

  - claim_id: "CLM_P3_SVAF_01"
    paper: "paper3_execution"
    section: "Context Engineering"
    statement: "Symbolic-Vector Attention Fusion (SVAF) was introduced as prior art by Hongwei Xu (arXiv:2604.03955, April 2026); Finance-SVAF is our proposed domain-specific adaptation."
    claim_type: "LITERATURE_VERIFIED"
    source_artifact: "papers/references.bib"
    verification_test: "papers/paper3_execution/review_paper3_evidence_gated_manuscript.md"
    status: "VERIFIED"

  - claim_id: "CLM_P3_SVAF_02"
    paper: "paper3_execution"
    section: "Context Engineering"
    statement: "Finance-SVAF evaluates hard risk constraints (leverage caps, drawdown thresholds) as deterministic Boolean contracts, invoking an explicit abstention policy upon violation."
    claim_type: "PROPOSED_FRAMEWORK"
    source_artifact: "papers/paper3_execution/review_paper3_evidence_gated_manuscript.md"
    verification_test: "Section IV.B"
    status: "VERIFIED"
