[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.3.0"
description = "Systematic Quantitative Research & Production Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "sympy>=1.12.0",
    "gymnasium>=0.28.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
]

[project.scripts]
quant-cli = "quant_research.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
